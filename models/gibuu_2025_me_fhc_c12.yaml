# GiBUU Release 2025 (patch 5) numu CC on carbon under the MINERvA ME FHC flux — the truth-level
# generator sample for the 1mu1p / TKI channel (arXiv:2503.15047 reproduction). Every value below is a
# physics default taken from GiBUU's own MINERvA-ME card (testRun/jobCards/005_Neutrino_MINERvA_ME-nu.job)
# unless noted; the analyst ratifies them (docs/decisions.md 2026-09-15). The sample is generated on
# the FNAL grid (`ndp gibuu plan/submit-cmd/status/harvest/merge`, grid/README.md) and cached under
# runs/_generator_cache/gibuu_<fingerprint>/truth.npz; `ndp run` refuses to launch a campaign itself.
#
# Target: carbon only. Hydrogen (8.2 % of CH by mass) cannot produce a 1mu1p signal event (no neutron,
# no final-state interactions to absorb the pion), so a C12 sample scaled by the channel's n_nucleons
# (all nucleons of the fiducial CH volume, the paper's per-nucleon convention) stands for the CH target.
name: gibuu_2025_me_fhc_c12
kind: gibuu
description: >
  GiBUU 2025 numu CC on 12C under the NuMI ME FHC flux, generated as fixed-energy integratedSigma runs on a
  flux-weighted 0.5 GeV energy grid (2-60 GeV, 116 points, 156 grid jobs, ~1.07M events with near-uniform
  weights); in-medium resonance widths on, 2p2h and two-pion background on.
author: ndp-platform (defaults from GiBUU's 005_Neutrino_MINERvA_ME-nu.job; analyst to ratify)
target: {Z: 6, A: 12}
process_ID: 2            # CC
flavor_ID: 2             # numu
include: {QE: true, DELTA: true, RES: true, 1pi: true, DIS: true, 2p2hQE: true, 2pi: true}
card:
  num_ensembles: 1000    # events ~ A x numEnsembles x num_runs per job (~12k)
  num_time_steps: 150    # 150 x 0.2 fm = 30 fm of hadron transport
  delta_T: 0.2
  num_runs: 1            # num_runs_SameEnergy
  medium_switch: true          # &width_Baryon mediumSwitch (GiBUU's MINERvA card; the platform smoke card had it off)
  medium_switch_delta: true    # Oset broadening of the Delta
  medium_switch_coll: false
  eqs_type: 5            # medium momentum-dependent potential
  delta_pot: 1           # 2/3 of the nucleon potential
  density_switch_static: 2
  apply_cuts: 2          # only unbound particles are written to FinalEvents.dat
flux: {source: channel, bin_width_gev: 0.5, e_max_gev: 100.0}   # resources/flux/arXiv2110.13372_supplemental.txt Table I (the flux-averaged MC mode's file; unused in energy_scan)
# Generation mode (docs/decisions.md 2026-09-15, gibuu skill Part 2.4/2.4b): the flux-averaged MC mode (nuXsectionMode 16)
# gives QE events whose weights are unusable (tails beyond any rejection ceiling); the fixed-energy integratedSigma mode
# (nuXsectionMode 0) draws the kinematics by rejection inside GiBUU and its weights are uniform to ~35 %. So: one job per
# point of a flux-weighted energy grid, merged with weight = perweight x (flux fraction of the point's bin) / n_jobs.
mode: energy_scan
energy_grid: {e_min_gev: 2.0, e_max_gev: 60.0, step_gev: 0.5}   # 116 bin centres; no 1mu1p signal below 2 GeV (p_mu > 2 GeV/c); the > 60 GeV tail is dropped
total_ensembles: 85000   # ~ 1.02M test nucleons = events (mode 0 makes one event per nucleon), allocated ~ flux x E; ~6 % are 1mu1p signal
min_ensembles: 100       # GiBUU refuses fewer
max_ensembles_per_job: 1500   # 18k nucleons per job: ~0.7-1.1 s each measured on the EAF node -> 3.5-5.5 h per job
seed: 20260915           # job j runs with seed + j
notes:
  - "status default: card physics = GiBUU's own MINERvA-ME card; ratify before quoting the sample"
  - "status default: the 0.5 GeV energy discretisation of the flux (the muon spectrum inside a point is continuous) and the 2-60 GeV range"
  - "status default: statistics 85 000 ensembles (~1.07M events over 156 jobs, ~60k 1mu1p signal events)"
  - "measured 2026-09-15: sigma_CC(6 GeV) = 4.18e-38 cm^2/nucleon (QE 0.376, GENIE G18_02a 4.66 / 0.43); two seeds agree on sigma_QE to 1 %"
