# Environment specification for the NDP platform. Not installed automatically — run `pixi install`
# when you want an isolated environment; the package also runs on any Python >= 3.10 that has
# numpy, pyyaml, uproot, awkward and matplotlib (scipy optional, pytest for the test suite).
[workspace]
name = "ndp-platform"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.10"
numpy = ">=1.26"
scipy = ">=1.11"
pyyaml = ">=6"
uproot = ">=5.3"
awkward = ">=2.6"
matplotlib = ">=3.8"
xrootd = ">=5.6"
fsspec-xrootd = ">=0.4"
pytest = ">=8"

[tasks]
test = "python -m pytest tests/ -q"
channels = "python -m ndp channels"
